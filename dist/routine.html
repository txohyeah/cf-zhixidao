<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>放学流程 · 智习岛</title><script src="/student-context.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#222;font-family:system-ui,sans-serif}header{display:flex;gap:16px;align-items:center;padding:16px 24px;background:#e9e1d2}header #student-switch{margin-left:auto}main{max-width:800px;margin:24px auto;padding:24px;background:white}h1{font-size:30px;margin:0 0 8px}.meta,.online,footer{color:#555;font-size:14px}button{font:inherit;cursor:pointer;padding:8px 15px}ol{list-style:none;padding:0;margin:20px 0}li{display:grid;grid-template-columns:45px 1fr 30px;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid #aaa;break-inside:avoid}.number{font-size:25px;font-weight:bold}.step{font-size:22px;font-weight:700}.note{display:block;font-size:16px;font-weight:400;margin-top:4px}.check{width:22px;height:22px;border:2px solid #222}footer{margin-top:18px}@page{size:A4 portrait;margin:15mm}@media print{body{background:white}header,.online,button{display:none}main{margin:0;padding:0;max-width:none}h1{font-size:24pt}li{padding:5mm 1mm}.step{font-size:16pt}.note{font-size:11pt}.number{font-size:18pt}footer{font-size:9pt}}
</style><style>.v12-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px}.v12-nav span{font-size:12px}.v12-lib{border-left:1px solid;padding-left:12px}@media print{.v12-nav{display:none}}</style></head><body><header><a href="/">首页</a><a href="/print.html">打印中心</a><span id="student-switch"></span></header><nav class="v12-nav" aria-label="主导航"><span>学习</span><a href="/">首页</a><a href="/wrong.html">错题</a><a href="/papers.html">考卷</a><a href="/math.html">口算</a><span class="v12-lib">知识库</span><a href="/kb.html">知识树</a></nav><main><h1 id="title">放学流程</h1><p class="meta" id="meta"></p><p class="online" id="reference"></p><button type="button" onclick="window.print()">🖨 打印</button><p id="message">正在加载…</p><ol id="steps"></ol><footer id="footer"></footer></main><script>
(async()=>{try{const r=await fetch('/api/routine');if(!r.ok)throw Error();const d=await r.json();const msg=document.getElementById('message');if(!d.routine){msg.textContent='还没有放学流程';return}msg.remove();document.getElementById('title').textContent=d.routine.title;document.getElementById('meta').textContent='版本 '+d.routine.version+' · 生效日期 '+d.routine.effective_from;document.getElementById('reference').textContent='当前待复习 '+d.pending_wrong+' 道（仅供参考）';document.getElementById('footer').textContent=d.routine.title+' · 生效日期 '+d.routine.effective_from;const list=document.getElementById('steps');d.steps.forEach((s,i)=>{const li=document.createElement('li'),n=document.createElement('span'),content=document.createElement('div'),check=document.createElement('span');n.className='number';n.textContent=i+1;content.className='step';content.textContent=s.name+(s.time_hint?' · '+s.time_hint:'');if(s.note){const note=document.createElement('span');note.className='note';note.textContent=s.note;content.append(note)}check.className='check';check.setAttribute('aria-label','纸面勾选框');li.append(n,content,check);list.append(li)})}catch(e){document.getElementById('message').textContent='流程加载失败，请检查孩子选择后重试'}})();
</script></body></html>
