<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智习岛</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:linear-gradient(160deg,#ff9a62,#ff6f91); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { background:#fff; border-radius:16px; padding:28px 26px; width:320px; box-shadow:0 8px 30px rgba(120,50,20,.25); }
  .logo { text-align:center; font-size:24px; font-weight:800; color:#ff6f91; margin-bottom:4px; }
  .sub { text-align:center; font-size:12px; color:#a29b8e; margin-bottom:18px; }
  input { width:100%; padding:11px 12px; border:1px solid #ddd5c6; border-radius:9px; margin-bottom:12px; font-size:15px; }
  button { width:100%; padding:11px 0; border:0; border-radius:9px; background:#ff6f91; color:#fff; font-size:15px; cursor:pointer; }
  .msg { font-size:12px; min-height:16px; margin-bottom:8px; text-align:center; }
  .msg.err { color:#d33; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🏝️ 智习岛</div>
    <div class="sub">我们的学习小站 · 仅限家人</div>
    <div class="msg" id="msg"></div>
    <input id="username" placeholder="用户名" autocomplete="username">
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <button onclick="login()">登 录</button>
  </div>
<script>
async function login(){
  const msg = document.getElementById('msg');
  msg.textContent = ''; msg.className = 'msg';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; msg.className = 'msg err'; return; }
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ username, password }) });
  const d = await r.json();
  if (d.ok) location.href = '/';
  else { msg.textContent = d.error || '登录失败'; msg.className = 'msg err'; }
}
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
